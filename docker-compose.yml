services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: caixaclaro
      POSTGRES_USER: caixaclaro
      POSTGRES_PASSWORD: dev_only_change_me
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caixaclaro -d caixaclaro"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
    command: uvicorn caixaclaro.main:app --host 0.0.0.0 --port 8000
volumes:
  pg_data:
