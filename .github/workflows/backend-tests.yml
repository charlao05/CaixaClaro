name: Backend - pytest

on:
  push:
    paths:
      - 'backend/**'
      - 'Caddyfile'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caixaclaro
          POSTGRES_PASSWORD: dev_only_change_me
          POSTGRES_DB: caixaclaro
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend + dev
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # O Caddyfile fica na raiz, mas é o backend que depende dele (IP do
      # cliente, rotas de saúde). tests/test_caddyfile.py usa este binário
      # para provar o comportamento num Caddy de verdade; sem ele, só a
      # leitura do arquivo é testada.
      - name: Baixar Caddy (versão e checksum fixos)
        env:
          CADDY_VERSION: "2.11.7"
          CADDY_SHA512: "a7a433a1b133efc3c8d10eb0b99d52a24b5ef5c322dc77f5282182b1c0402139ab83f3a99f0c52409df77d20123fb0b523edad8a66d8f5e49136197bf61ef0e7"
        run: |
          set -euo pipefail
          arquivo="caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$arquivo" \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/$arquivo"
          echo "${CADDY_SHA512}  $RUNNER_TEMP/$arquivo" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/$arquivo" -C "$RUNNER_TEMP" caddy
          "$RUNNER_TEMP/caddy" version
          echo "CADDY_BIN=$RUNNER_TEMP/caddy" >> "$GITHUB_ENV"

      - name: Run pytest
        env:
          DATABASE_URL: postgresql://caixaclaro:dev_only_change_me@localhost:5432/caixaclaro
        run: pytest -q
