name: M9.2 - Eval runner

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/eval.yml'
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend + dev
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run eval runner
        run: python -m caixaclaro.eval.runner --publicar var/eval/ultima_execucao.json

      - name: Publicar snapshot como artefato
        uses: actions/upload-artifact@v4
        with:
          name: eval-ultima-execucao
          path: backend/var/eval/ultima_execucao.json
          if-no-files-found: error
